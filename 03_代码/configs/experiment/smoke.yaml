# 冒烟实验：40 个小区、极小模型、每轮 5 批、2 轮，只检查流程能否跑通（不看数值）
_base_: ../default.yaml
data:
  zones: 40
model:
  D: 16
  dilations: [1, 2, 4, 8]
  head_hidden: 32
  staeformer: {d_model: 16, tod_dim: 8, dow_dim: 8, adaptive_dim: 16, heads: 2, layers: 1, ff_dim: 64}
train:
  device: cpu
  epochs: 2
  patience: 5
  batch_size: 8
  max_train_batches: 5
  run_name: smoke_gwn_cut
